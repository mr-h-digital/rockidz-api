spring:
  application:
    name: rockidz-api

  datasource:
    # Priority:
    # 1) SPRING_DATASOURCE_* (explicit)
    # 2) Railway PG* vars (PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD)
    # 3) Railway POSTGRES_* vars (POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD)
    # 4) Local defaults
    # If Railway only provides DATABASE_URL, RockidzApiApplication maps it at startup.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:${POSTGRES_DB:rockidz}}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:${POSTGRES_USER:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${POSTGRES_PASSWORD:postgres}}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-railway-env-vars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}   # 24h
  auth:
    reset-token-minutes: ${RESET_TOKEN_MINUTES:30}
    expose-reset-token: ${EXPOSE_RESET_TOKEN:false}
    reset-base-url: ${RESET_BASE_URL:https://rockidz.rockmission.co.za/reset-password}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://rockidz.rockmission.co.za}
  storage:
    endpoint-url: ${STORAGE_ENDPOINT_URL:}
    region: ${STORAGE_REGION:}
    bucket-name: ${STORAGE_BUCKET_NAME:}
    access-key-id: ${STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${STORAGE_SECRET_ACCESS_KEY:}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}

logging:
  level:
    co.za.rockmission: INFO
    org.springframework.security: INFO
