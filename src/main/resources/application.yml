spring:
  application:
    name: rock-mission-learn-api

  datasource:
    # Railway injects DATABASE_URL as postgres://user:pass@host:port/db
    # Spring needs jdbc:postgresql://... — see DataSourceConfig for the conversion,
    # or set these three env vars directly on Railway instead:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rockmission_learn}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-railway-env-vars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}   # 24h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://learn.rockmission.co.za}

logging:
  level:
    co.za.rockmission: INFO
    org.springframework.security: INFO
